<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>CycleLab</title>
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <div class="container">
            <!-- Left Panel: Preview and Controls -->
            <div class="left-panel">
                <div class="panel-header">
                    <h2>Preview</h2>
                </div>

                <div class="preview-container">
                    <canvas id="preview-canvas" width="256" height="256"></canvas>
                </div>

                <div class="controls">
                    <div class="control-group">
                        <label for="levels-slider">Brightness Levels</label>
                        <input type="range" id="levels-slider" min="2" max="16" value="8" step="1" />
                        <span id="levels-display">8</span>
                    </div>

                    <div class="control-group">
                        <label>Resolution</label>
                        <div class="resolution-buttons">
                            <button class="resolution-btn" data-size="8">8×8</button>
                            <button class="resolution-btn active" data-size="16">16×16</button>
                            <button class="resolution-btn" data-size="32">32×32</button>
                            <button class="resolution-btn" data-size="64">64×64</button>
                        </div>
                    </div>

                    <div class="control-group">
                        <label>Tools</label>
                        <div class="tool-buttons">
                            <button class="tool-btn active" data-tool="pencil">Pencil</button>
                            <button class="tool-btn" data-tool="eraser">Eraser</button>
                        </div>
                    </div>

                    <div class="control-group">
                        <label>Palette</label>
                        <div id="palette-container" class="palette-container"></div>
                    </div>

                    <div class="control-group">
                        <button id="undo-btn">Undo (⌘Z)</button>
                        <button id="redo-btn">Redo (⌘Y)</button>
                    </div>

                    <div class="control-group">
                        <label for="play-button">Playback</label>
                        <div class="playback-controls">
                            <button id="play-button">Play</button>
                            <input type="range" id="scrub-slider" min="0" max="7" value="0" step="1" />
                            <input type="number" id="speed-input" value="4" min="1" max="20" step="1" />
                            <label for="speed-input">steps/sec</label>
                        </div>
                    </div>

                    <div class="control-group">
                        <label for="threshold-mode">Threshold Mode</label>
                        <select id="threshold-mode">
                            <option value="none">None</option>
                            <option value="mask">Mask</option>
                            <option value="binary">Binary</option>
                        </select>
                        <input type="range" id="threshold-value" min="0" max="255" value="128" step="1" />
                        <label for="threshold-value">Threshold: <span id="threshold-display">128</span></label>
                    </div>

                    <div class="control-group">
                        <button id="export-json">Export JSON</button>
                        <button id="export-pbm">Export PBM</button>
                    </div>
                </div>
            </div>

            <!-- Right Panel: Editor -->
            <div class="right-panel">
                <div class="panel-header">
                    <h2>Editor</h2>
                </div>

                <div class="editor-container">
                    <canvas id="editor-canvas" width="512" height="512"></canvas>
                </div>
            </div>
        </div>

        <script type="module" src="app.js"></script>
    </body>
</html>
